<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Journey - MindLab</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Style Utama & Invoice -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/invoice.css">
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>

    <!-- NAVBAR (GLASSMORPHISM) - SAMA SEPERTI INDEX -->
    <nav>
        <div class="container nav-container">
            <a href="index.html" class="logo">Mind<span>Lab</span></a>
            
            <!-- Tombol Burger untuk Mobile -->
            <div class="menu-toggle" id="mobile-menu">
                <i class="fas fa-bars"></i>
            </div>
            
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="modul-ajar.html">Modul & Worksheet</a></li>
                <li><a href="pendaftaran.html" class="btn" style="padding: 10px 24px; box-shadow: none; color: #ffffff; font-weight: 700;">Daftar</a></li>
            </ul>
        </div>
    </nav>

    <div class="invoice-container" style="margin-top: 40px;">
        
        <!-- Panel Pencarian & Filter -->
        <div class="control-panel" style="flex-direction: column; gap: 12px; align-items: stretch;">
            <div class="search-box" style="max-width: 100%;">
                <input type="text" id="searchJourneyInput" placeholder="Ketik ID Siswa" style="width: 100%;" />
            </div>
            
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <select id="filterPeriode" style="flex: 1; padding: 12px 16px; border: 2px solid #E2E8F0; border-radius: 100px; outline: none; font-weight: 500; background: white; color: var(--brand-dark);">
                    <option value="">Semua Periode</option>
                    <option value="Juli 2026">Juli 2026</option>
                    <option value="Ags 2026">Ags 2026</option>
                </select>
                
                <select id="filterMatpel" style="flex: 1; padding: 12px 16px; border: 2px solid #E2E8F0; border-radius: 100px; outline: none; font-weight: 500; background: white; color: var(--brand-dark);">
                    <option value="">Semua Mata Pelajaran</option>
                    <option value="Matematika">Matematika</option>
                    <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                    <option value="Bahasa Inggris">Bahasa Inggris</option>
                    <option value="IPAS">IPAS</option>
                </select>

                <button onclick="searchJourney()" style="padding: 12px 28px;" class="btn">Cari Journey</button>
            </div>
        </div>

        <!-- Header Learning Journey -->
        <header class="invoice-header">
            <div class="brand">
                <h1>Mind<span>Lab</span></h1>
                <p>LEARNING JOURNEY STUDIO</p>
            </div>
            <div class="invoice-title">
                <h2>JOURNEY</h2>
            </div>
        </header>

        <!-- Informasi Siswa -->
        <section class="invoice-details" id="student-info-section" style="display: none;">
            <div class="billed-to">
                <p class="label">LAPORAN BELAJAR UNTUK:</p>
                <h3 id="journey-student-name">-</h3>
                <p class="sub-text">Total Pertemuan Tercatat: <span id="total-sessions">0</span> Sesi</p>
            </div>
        </section>

        <!-- Container Daftar Riwayat / Timeline Sesi -->
        <div id="journey-timeline-container">
            <p class="text-muted" style="text-align: center; padding: 30px;">Silakan ketik ID siswa dan sesuaikan filter di atas.</p>
        </div>

        <footer class="invoice-footer" style="margin-top: 40px;">
            <p>Terus semangat belajar bersama MindLab!</p>
            <p class="motto">Learn. Explore. Grow.</p>
        </footer>
    </div>

    <!-- SCRIPT UTAMA & FETCH JOURNEY -->
    <script src="js/main.js"></script>
    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwCV4DusbQd3GeQ8ZUvrx2cvdhfcj0uobi0dJoETvv5YVnO-CaENVm4uR8GIUMsHKualg/exec';

        function searchJourney() {
            const inputIdSiswa = document.getElementById('searchJourneyInput').value.trim();
            const periode = document.getElementById('filterPeriode').value;
            const matpel = document.getElementById('filterMatpel').value;
            
            const container = document.getElementById('journey-timeline-container');
            const infoSection = document.getElementById('student-info-section');
            const nameHeader = document.getElementById('journey-student-name');
            const totalSessionsEl = document.getElementById('total-sessions');

            if (!inputIdSiswa) {
                alert('Silakan masukkan ID siswa terlebih dahulu!');
                return;
            }

            container.innerHTML = '<p style="text-align: center; padding: 30px; color: var(--text-muted);">Memuat data perjalanan belajar...</p>';
            infoSection.style.display = 'none';

            let targetUrl = `${WEB_APP_URL}?action=getJourney&id=${encodeURIComponent(inputIdSiswa)}`;
            if (periode) targetUrl += `&periode=${encodeURIComponent(periode)}`;
            if (matpel) targetUrl += `&matpel=${encodeURIComponent(matpel)}`;

            fetch(targetUrl)
                .then(response => response.json())
                .then(result => {
                    if (result.status !== 'success' || !result.data || result.data.length === 0) {
                        container.innerHTML = '<p style="text-align: center; padding: 30px; color: #B91C1C; font-weight: 600;">Data pembelajaran tidak ditemukan dengan ID atau filter tersebut.</p>';
                        return;
                    }

                    const dataSesi = result.data;
                    nameHeader.textContent = dataSesi[0].namaSiswa;
                    totalSessionsEl.textContent = dataSesi.length;
                    infoSection.style.display = 'grid';

                    let html = '<div style="display: flex; flex-direction: column; gap: 20px;">';
                    
                    dataSesi.forEach((item, index) => {
                        html += `
                            <div style="background: var(--brand-light); border: 1px solid #E2E8F0; border-radius: var(--radius-md); padding: 24px;">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
                                    <strong style="color: var(--brand-primary); font-size: 1.1rem;">Sesi #${index + 1} — ${item.matpel || 'Umum'} (${item.jenjang || '-'})</strong>
                                    <span class="status-badge lunas">${item.tanggalSesi} (${item.periode})</span>
                                </div>

                                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-bottom: 14px; font-size: 0.9rem; color: var(--text-muted);">
                                    <div><strong>Waktu:</strong> ${item.sesiWaktu}</div>
                                    <div><strong>Tutor:</strong> ${item.tutor}</div>
                                    <div><strong>Kelas:</strong> ${item.kelas}</div>
                                </div>

                                <div style="margin-bottom: 12px;">
                                    <span class="label" style="margin-bottom: 2px;">Topik: <strong>${item.topik || '-'}</strong></span>
                                    <p style="font-size: 0.95rem; color: var(--brand-dark);"><strong>Materi:</strong> ${item.materi || '-'}</p>
                                </div>

                                ${item.tercapai ? `
                                <div style="background: #DCFCE7; color: #15803D; padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 10px; font-size: 0.9rem; border: 1px solid #BBF7D0;">
                                    <strong>✅ Yang Dicapai:</strong> ${item.tercapai}
                                </div>` : ''}

                                ${item.pengayaan ? `
                                <div style="background: var(--white); padding: 12px 16px; border-radius: var(--radius-sm); border-left: 4px solid var(--brand-primary); border: 1px solid #E2E8F0; font-size: 0.9rem;">
                                    <strong style="color: var(--brand-primary);">💡 Catatan / Pengayaan:</strong>
                                    <p style="color: var(--text-main); margin-top: 4px;">${item.pengayaan}</p>
                                </div>` : ''}
                            </div>
                        `;
                    });

                    html += '</div>';
                    container.innerHTML = html;
                })
                .catch(error => {
                    console.error('Error:', error);
                    container.innerHTML = '<p style="text-align: center; padding: 30px; color: #B91C1C;">Terjadi kesalahan saat mengambil data.</p>';
                });
        }

        document.getElementById('searchJourneyInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchJourney();
            }
        });
    </script>
</body>
</html>
